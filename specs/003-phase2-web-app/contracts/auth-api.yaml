openapi: 3.0.3
info:
  title: Evolution of Todo - Authentication API
  description: Authentication endpoints for user registration, signin, signout, and session management
  version: 1.0.0
  contact:
    name: Phase II - Full-Stack Web Application

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.todo-app.example.com
    description: Production server (placeholder)

tags:
  - name: Authentication
    description: User authentication and session management

paths:
  /auth/signup:
    post:
      tags:
        - Authentication
      summary: Register new user account
      description: |
        Creates a new user account with email and password. Email must be unique.
        Password is hashed before storage (never stored in plain text).
        On success, creates session and returns user data with session cookie.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            examples:
              valid:
                summary: Valid signup request
                value:
                  email: user@example.com
                  password: securepassword123
      responses:
        '201':
          description: User created successfully and session established
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=abc123...; HttpOnly; Secure; SameSite=Lax; Max-Age=86400
              description: Session cookie (24-hour expiry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: Successful signup
                  value:
                    id: 1
                    email: user@example.com
                    created_at: "2025-12-28T10:30:00Z"
        '400':
          description: Validation error (invalid email, password too short, missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_email:
                  summary: Invalid email format
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Invalid email format
                      field: email
                password_too_short:
                  summary: Password too short
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Password must be at least 8 characters
                      field: password
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicate_email:
                  summary: Duplicate email
                  value:
                    error:
                      code: CONFLICT
                      message: Email already registered
                      field: email
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signin:
    post:
      tags:
        - Authentication
      summary: Authenticate user and create session
      description: |
        Authenticates user with email and password. On success, creates session
        and returns user data with session cookie.
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
            examples:
              valid:
                summary: Valid signin request
                value:
                  email: user@example.com
                  password: securepassword123
      responses:
        '200':
          description: Authentication successful, session established
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=abc123...; HttpOnly; Secure; SameSite=Lax; Max-Age=86400
              description: Session cookie (24-hour expiry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                success:
                  summary: Successful signin
                  value:
                    id: 1
                    email: user@example.com
                    created_at: "2025-12-28T10:30:00Z"
        '400':
          description: Validation error (missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_fields:
                  summary: Missing email or password
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Email and password are required
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  summary: Wrong email or password
                  value:
                    error:
                      code: AUTHENTICATION_ERROR
                      message: Invalid email or password
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signout:
    post:
      tags:
        - Authentication
      summary: Terminate user session
      description: |
        Invalidates the current session and clears the session cookie.
        User must be authenticated to signout.
      operationId: signout
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session terminated successfully (no content)
          headers:
            Set-Cookie:
              schema:
                type: string
                example: session=; Max-Age=0
              description: Session cookie cleared
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_authenticated:
                  summary: No valid session
                  value:
                    error:
                      code: AUTHENTICATION_ERROR
                      message: Authentication required
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/session:
    get:
      tags:
        - Authentication
      summary: Verify current session and get user info
      description: |
        Checks if current session is valid and returns authenticated user data.
        Used by frontend to check auth status on page load.
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session valid, user data returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                valid_session:
                  summary: Valid session
                  value:
                    id: 1
                    email: user@example.com
                    created_at: "2025-12-28T10:30:00Z"
        '401':
          description: Session invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                session_expired:
                  summary: Session expired
                  value:
                    error:
                      code: AUTHENTICATION_ERROR
                      message: Session expired. Please sign in again.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address (must be unique)
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 255
          format: password
          description: User's password (minimum 8 characters)
          example: securepassword123

    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address
          example: user@example.com
        password:
          type: string
          minLength: 1
          maxLength: 255
          format: password
          description: User's password
          example: securepassword123

    UserResponse:
      type: object
      required:
        - id
        - email
        - created_at
      properties:
        id:
          type: integer
          description: User's unique identifier
          example: 1
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp (ISO 8601)
          example: "2025-12-28T10:30:00Z"
      description: User data (never includes password_hash)

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - AUTHENTICATION_ERROR
                - CONFLICT
                - INTERNAL_ERROR
              description: Error code for client handling
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid email format
            field:
              type: string
              description: Field name that caused error (for validation errors)
              example: email
            details:
              type: object
              additionalProperties: true
              description: Additional error context (optional)

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie set by signup/signin endpoints
